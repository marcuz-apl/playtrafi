[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playtrafi"
version = "0.7.0"
description = "Stealth web scraper & markdown extractor for LLMs, pairing Patchright with Trafilatura."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "marcuz-apl", email = "support@alfazen.org" }
]
maintainers = [
    { name = "Alfazen Inc.", email = "support@alfazen.org" }
]
keywords = [
    "crawler",
    "scraper",
    "stealth",
    "patchright",
    "playwright",
    "trafilatura",
    "markdown",
    "llm",
    "rag",
    "web-scraping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "patchright>=1.49.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
docs = [
    "mkdocs-material>=9.5.0",
]
all = [
    "playtrafi[server,dev,docs]",
]

[project.scripts]
playtrafi = "playtrafi.cli:main"
patchtroy = "playtrafi.cli:main"

[project.urls]
Homepage = "https://github.com/marcuz-apl/playtrafi"
Repository = "https://github.com/marcuz-apl/playtrafi"
Issues = "https://github.com/marcuz-apl/playtrafi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/playtrafi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
